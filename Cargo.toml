[package]
name = "mef-battery"
version = "0.1.0"
edition = "2021"
authors = ["mef"]
description = "Lightweight wireless peripheral battery monitor for Windows with System Tray support"

[dependencies]
hidapi = "2.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
